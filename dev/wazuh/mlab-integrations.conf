<!-- Appended to the stock manager ossec.conf by dev/setup.sh; __X__ placeholders are filled there. -->
<ossec_config>
  <integration>
    <name>custom-mlab</name>
    <api_key>__MLAB_API_KEY__</api_key>
    <group>syscheck,authentication_failed,squid,vulnerability-detector</group>
    <alert_format>json</alert_format>
    <options>{"hash": true, "url": true, "cve": true, "ip": true}</options>
  </integration>

  <integration>
    <name>custom-mlab-ir</name>
    <hook_url>http://ir-app:8080</hook_url>
    <api_key>__IR_TOKEN__</api_key>
    <level>10</level>
    <alert_format>json</alert_format>
  </integration>
</ossec_config>
