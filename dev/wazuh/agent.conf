<!-- Pushed to every agent in the default group. Feeds the e2e tests (dev/e2e.sh). -->
<agent_config>
  <!-- file hashes: real-time FIM -->
  <syscheck>
    <directories realtime="yes" check_all="yes">/mlab-fim</directories>
  </syscheck>

  <!-- IPs: sshd failures (rule 5710, data.srcip) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/mlab-logs/auth.log</location>
  </localfile>

  <!-- URLs: squid access log (rule 35005, data.url) -->
  <localfile>
    <log_format>squid</log_format>
    <location>/mlab-logs/squid.log</location>
  </localfile>

  <!-- CVEs: JSON shaped like vulnerability-detector events, matched by the stock rules 23501-23506 -->
  <localfile>
    <log_format>json</log_format>
    <location>/mlab-logs/vuln.json</location>
  </localfile>
</agent_config>
